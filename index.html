<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Tienda Demo</h1>
    </header>

    <section class="products">
        <article class="product">
            <img src="https://via.placeholder.com/150" alt="Producto 1">
            <h2>Producto 1</h2>
            <p class="price">$10.00</p>
            <button class="add-to-cart" data-product="Producto 1">Agregar al carrito</button>
        </article>
        <article class="product">
            <img src="https://via.placeholder.com/150" alt="Producto 2">
            <h2>Producto 2</h2>
            <p class="price">$20.00</p>
            <button class="add-to-cart" data-product="Producto 2">Agregar al carrito</button>
        </article>
        <article class="product">
            <img src="https://via.placeholder.com/150" alt="Producto 3">
            <h2>Producto 3</h2>
            <p class="price">$30.00</p>
            <button class="add-to-cart" data-product="Producto 3">Agregar al carrito</button>
        </article>
    </section>

    <footer>
        <p>&copy; 2024 Tienda Demo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
